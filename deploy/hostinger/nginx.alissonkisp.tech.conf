# Copie para /etc/nginx/sites-available/alissonkisp.tech na VPS.
# DNS: alissonkisp.tech e www → A record → IP da VPS
# SSL: certbot --nginx -d alissonkisp.tech -d www.alissonkisp.tech

server {
  listen 80;
  server_name alissonkisp.tech www.alissonkisp.tech;
  return 301 https://alissonkisp.tech$request_uri;
}

server {
  listen 443 ssl http2;
  server_name www.alissonkisp.tech;

  # certbot preenche ssl_certificate* após o primeiro run

  return 301 https://alissonkisp.tech$request_uri;
}

server {
  listen 443 ssl http2;
  server_name alissonkisp.tech;

  # certbot preenche ssl_certificate*

  client_max_body_size 2m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
