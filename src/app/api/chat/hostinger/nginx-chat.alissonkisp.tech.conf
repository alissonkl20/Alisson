# Copie para /etc/nginx/sites-available/ na VPS Hostinger.
# DNS: chat.alissonkisp.tech → A record → IP da VPS
# SSL: certbot --nginx -d chat.alissonkisp.tech

limit_req_zone $binary_remote_addr zone=chat_ip:10m rate=10r/m;

server {
  listen 443 ssl http2;
  server_name chat.alissonkisp.tech;

  # certbot preenche ssl_certificate* após o primeiro run

  location / {
    limit_req zone=chat_ip burst=3 nodelay;
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
