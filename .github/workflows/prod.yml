name: Next.js CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - main


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout código
        uses: actions/checkout@v4


      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      - name: Instalar dependências
        run: npm ci


      - name: Build Next.js
        run: npm run build